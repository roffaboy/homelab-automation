---
# Fixed wiring between the apps. Settings you might change are in defaults/main.yml.

# Ansible talks to each app on its published port on the host.
app_config_urls:
  qbittorrent: "http://127.0.0.1:{{ homelab_ports.qbittorrent }}"
  radarr: "http://127.0.0.1:{{ homelab_ports.radarr }}"
  sonarr: "http://127.0.0.1:{{ homelab_ports.sonarr }}"
  prowlarr: "http://127.0.0.1:{{ homelab_ports.prowlarr }}"
  jellyfin: "http://127.0.0.1:{{ homelab_ports.jellyfin }}"
  seerr: "http://127.0.0.1:{{ homelab_ports.seerr }}"
  bazarr: "http://127.0.0.1:{{ homelab_ports.bazarr }}"
  cleanuparr: "http://127.0.0.1:{{ homelab_ports.cleanuparr }}"
  maintainerr: "http://127.0.0.1:{{ homelab_ports.maintainerr }}"
  suggestarr: "http://127.0.0.1:{{ homelab_ports.suggestarr }}"
  holyarrs: "http://127.0.0.1:{{ homelab_ports.holyarrs }}"

# API version, Compose stack, and the config file holding the API key each app generates.
app_config_servarr:
  radarr:
    api: v3
    stack: media
    config: "{{ homelab_stack_dirs.media }}/appdata/radarr/config.xml"
  sonarr:
    api: v3
    stack: media
    config: "{{ homelab_stack_dirs.media }}/appdata/sonarr/config.xml"
  prowlarr:
    api: v1
    stack: download
    config: "{{ homelab_stack_dirs.download }}/appdata/prowlarr/config.xml"

# The apps reach each other by Docker service name and internal port.
app_config_arrs:
  - name: radarr
    port: 7878
    root_folder: /data/media/movies
    download_dir: /data/torrents/movies
    category: radarr
    category_field: movieCategory
    major_version: 6   # for Cleanuparr
  - name: sonarr
    port: 8989
    root_folder: /data/media/series
    download_dir: /data/torrents/tv
    category: tv-sonarr
    category_field: tvCategory
    major_version: 4
# Telegram: warnings before removal, removals and failures (8 + 16 + 32 + 64).
app_config_maintainerr_telegram_types:
  - 8
  - 16
  - 32
  - 64

# What Bazarr tells subtitle sites it is (subf2m needs a browser's).
app_config_bazarr_user_agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36

app_config_jellyfin_client: 'MediaBrowser Client="homelab-ansible", Device="ansible", DeviceId="homelab-ansible", Version="1.0"'
app_config_jellyfin_settings:
  - path: ""
    settings:
      ServerName: "{{ app_config_jellyfin_server_name }}"
  - path: /encoding
    settings: "{{ app_config_jellyfin_encoding }}"

app_config_recyclarr_small_qualities:
  - HDTV-720p
  - WEBDL-720p
  - WEBRip-720p
  - Bluray-720p
  - HDTV-1080p
  - WEBDL-1080p
  - WEBRip-1080p
  - Bluray-1080p
app_config_recyclarr_uhd_qualities:
  - WEBDL-2160p
  - WEBRip-2160p
  - Bluray-2160p
app_config_trash_uhd_profile: 64fb5f9858489bdac2af690e27c8f42f   # UHD Bluray + WEB

# Profiles Radarr and Sonarr create on install (HD-1080p is kept: Recyclarr fills it).
app_config_stock_profiles:
  - Any
  - SD
  - HD-720p
  - Ultra-HD
  - HD - 720p/1080p

# HolyArrs' quality ladder, low to high, and what Radarr and Sonarr call each step.
app_config_holyarrs_ladder:
  - cam
  - telesync
  - sd_tv
  - sd_dvd
  - 720p_tv
  - 720p_web
  - 720p_bluray
  - 1080p_tv
  - 1080p_web
  - 1080p_bluray
  - 1080p_remux
  - 2160p_web
  - 2160p_bluray
  - 2160p_remux
app_config_holyarrs_steps:
  SDTV: sd_tv
  DVD: sd_dvd
  HDTV-720p: 720p_tv
  WEBDL-720p: 720p_web
  WEBRip-720p: 720p_web
  WEB 720p: 720p_web
  Bluray-720p: 720p_bluray
  HDTV-1080p: 1080p_tv
  WEBDL-1080p: 1080p_web
  WEBRip-1080p: 1080p_web
  WEB 1080p: 1080p_web
  Bluray-1080p: 1080p_bluray
  WEBDL-2160p: 2160p_web
  WEBRip-2160p: 2160p_web
  Bluray-2160p: 2160p_bluray
# Language names as Radarr and Sonarr list them, and HolyArrs' codes.
app_config_holyarrs_languages:
  English: en
  French: fr
  German: de
  Italian: it
  Spanish: es
  Russian: ru
  Japanese: ja
  Korean: ko
  Polish: pl
  Dutch: nl
  Portuguese: pt
  Swedish: sv
  Danish: da
  Norwegian: 'no'
  Finnish: fi
  Czech: cs
  Hungarian: hu
  Greek: el
  Hebrew: he
  Turkish: tr
  Arabic: ar
  Hindi: hi
  Chinese: zh
  Thai: th
  Vietnamese: vi
  Ukrainian: uk
# The TRaSH profiles Recyclarr uses (templates/recyclarr.yml.j2), applied to HolyArrs' Pick rules
# so every release gets the same scores.
app_config_holyarrs_trash:
  movie:
    app: radarr
    profile: d1d67249d3890e49bc12e275d989a7e9   # HD Bluray + WEB
    label: Movies
  show:
    app: sonarr
    profile: 9d142234e45d6143785ac55f5a9e8dc9   # WEB-1080p (Alternative)
    label: Series
