---
# Fresh install: sign in with the Jellyfin admin, enable the libraries, add Radarr and
# Sonarr as default servers (kept the way they are set here).

- name: Seerr | Read the setup state
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/settings/public"
  register: _app_config_seerr_public
  check_mode: false

- name: Seerr | First-time setup
  ansible.builtin.include_tasks: seerr_setup.yml
  when: not _app_config_seerr_public.json.initialized

- name: Seerr | Read the config file
  ansible.builtin.slurp:
    src: "{{ homelab_stack_dirs.media }}/appdata/seerr/settings.json"
  register: _app_config_seerr_settings
  no_log: true

- name: Seerr | Remember the API key
  ansible.builtin.set_fact:
    _app_config_seerr_key: "{{ (_app_config_seerr_settings.content | b64decode | from_json).main.apiKey }}"
  no_log: true

# Radarr and Sonarr as Seerr's default servers, kept the way they are set here: a changed folder
# or profile is put back (the profile follows app_config_quality_profiles).
- name: Seerr | Read the quality profiles
  ansible.builtin.uri:
    url: "{{ app_config_urls[item.name] }}/api/v3/qualityprofile"
    headers:
      X-Api-Key: "{{ _app_config_api_keys[item.name] }}"
  loop: "{{ app_config_arrs }}"
  loop_control:
    label: "{{ item.name }}"
  register: _app_config_seerr_all_profiles
  check_mode: false
  no_log: true

- name: Seerr | Radarr and Sonarr as default servers
  vars:
    _arr: "{{ item.item }}"
    _profile: "{{ item.json | selectattr('name', 'equalto', app_config_quality_profiles[_arr.name]) | first }}"
    _server:
      name: "{{ _arr.name | capitalize }}"
      hostname: "{{ _arr.name }}"
      port: "{{ _arr.port }}"
      apiKey: "{{ _app_config_api_keys[_arr.name] }}"
      useSsl: false
      baseUrl: ""
      activeProfileId: "{{ _profile.id }}"
      activeProfileName: "{{ _profile.name }}"
      activeDirectory: "{{ _arr.root_folder }}"
      is4k: false
      isDefault: true
      externalUrl: ""
      syncEnabled: false
      preventSearch: false
      tags: []
    _extra:
      radarr:
        minimumAvailability: released
      sonarr:
        seriesType: standard
        animeSeriesType: anime
        activeAnimeProfileId: "{{ _profile.id }}"
        activeAnimeProfileName: "{{ _profile.name }}"
        activeAnimeDirectory: "{{ _arr.root_folder }}"
        enableSeasonFolders: true
  api_resource:
    url: "{{ app_config_urls.seerr }}/api/v1/settings/{{ _arr.name }}"
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
    read_only: [id]   # the id is in the address; Seerr refuses it in the body
    wanted: "{{ _server | combine(_extra[_arr.name]) }}"
  loop: "{{ _app_config_seerr_all_profiles.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: Seerr | Finish the setup
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/settings/initialize"
    method: POST
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
  when: not _app_config_seerr_public.json.initialized
  changed_when: true

# The defaults of every user; a user can still choose otherwise in their own profile. Without the API key:
# Seerr refuses it as read-only.
- name: Seerr | Discover and streaming region, languages
  rest_settings:
    url: "{{ app_config_urls.seerr }}/api/v1/settings/main"
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
    read_only:
      - apiKey
    wanted: "{{ app_config_seerr_discover }}"
  when: app_config_seerr_discover | length > 0
  no_log: true

- name: Seerr | Telegram notifications
  rest_settings:
    url: "{{ app_config_urls.seerr }}/api/v1/settings/notifications/telegram"
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
    recursive: true
    wanted:
      enabled: true
      types: "{{ app_config_seerr_telegram_types }}"
      options:
        botAPI: "{{ homelab_telegram_bot_token }}"
        chatId: "{{ homelab_telegram_chat_id }}"
  when: homelab_telegram | bool
  no_log: true

# Every Jellyfin user also gets a Seerr user. Seerr only knows the admin after the first sign-in, and
# Jellyfin Enhanced links a Jellyfin profile to the Seerr user with the same Jellyfin id: without
# one it shows "not connected" in Jellyfin. Users you add in Seerr itself are left alone.
- name: Seerr | Read the users
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/user?take=100"
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
  register: _app_config_seerr_users
  check_mode: false
  no_log: true

- name: Seerr | Read the Jellyfin users
  ansible.builtin.uri:
    url: "{{ app_config_urls.jellyfin }}/Users"
    headers:
      Authorization: MediaBrowser Token="{{ _app_config_jellyfin_api_key }}"
  register: _app_config_seerr_jf_users
  check_mode: false
  no_log: true
  when: _app_config_jellyfin_api_key is defined

- name: Seerr | Import the Jellyfin users it does not know yet
  vars:
    _known: "{{ _app_config_seerr_users.json.results | map(attribute='jellyfinUserId') | select | list }}"
    _missing: "{{ _app_config_seerr_jf_users.json | map(attribute='Id') | reject('in', _known) | list }}"
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/user/import-from-jellyfin"
    method: POST
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
    body_format: json
    body:
      jellyfinUserIds: "{{ _missing }}"
    status_code: [200, 201]
  changed_when: true
  no_log: true
  when:
    - _app_config_jellyfin_api_key is defined
    - _missing | length > 0

# The permissions you give chosen users, added to what they have (app_config_seerr_auto_approve_users:
# Auto-Approve, 128; app_config_seerr_admin_users: Admin, 2, which allows everything). Both in one
# task, so one cannot overwrite the other. The Seerr admin always has all of them.
- name: Seerr | Read the users again
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/user?take=100"
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
  register: _app_config_seerr_users_now
  check_mode: false
  no_log: true
  when: (app_config_seerr_auto_approve_users + app_config_seerr_admin_users) | length > 0

- name: Seerr | Give those users their permissions
  vars:
    _perm: "{{ item.permissions | int }}"
    _approve: >-
      {{ 128 if item.jellyfinUsername in app_config_seerr_auto_approve_users
                and (_perm | int // 128) % 2 == 0 else 0 }}
    _admin: >-
      {{ 2 if item.jellyfinUsername in app_config_seerr_admin_users
              and (_perm | int // 2) % 2 == 0 else 0 }}
  ansible.builtin.uri:
    url: "{{ app_config_urls.seerr }}/api/v1/user/{{ item.id }}/settings/permissions"
    method: POST
    headers:
      X-Api-Key: "{{ _app_config_seerr_key }}"
    body_format: json
    body:
      permissions: "{{ _perm | int + _approve | int + _admin | int }}"
  loop: >-
    {{ _app_config_seerr_users_now.json.results
       | selectattr('jellyfinUsername', 'in', app_config_seerr_auto_approve_users + app_config_seerr_admin_users)
       | list }}
  loop_control:
    label: "{{ item.jellyfinUsername }}"
  when:
    - (app_config_seerr_auto_approve_users + app_config_seerr_admin_users) | length > 0
    - (_approve | int) + (_admin | int) > 0
  changed_when: true
  no_log: true

# Jellyfin Enhanced (app_config_jellyfin_plugins): requests from Jellyfin's search through Seerr,
# and app_config_jellyfin_enhanced_settings.
- name: Seerr | Read the Jellyfin plugins
  ansible.builtin.uri:
    url: "{{ app_config_urls.jellyfin }}/Plugins"
    headers:
      Authorization: MediaBrowser Token="{{ _app_config_jellyfin_api_key }}"
  register: _app_config_seerr_jf_plugins
  check_mode: false
  no_log: true
  when: _app_config_jellyfin_api_key is defined

- name: Seerr | Jellyfin Enhanced
  vars:
    _plugin: "{{ _app_config_seerr_jf_plugins.json | selectattr('Name', 'equalto', 'Jellyfin Enhanced') | first }}"
    _url: "{{ app_config_urls.jellyfin }}/Plugins/{{ _plugin.Id }}/Configuration"
    _auth: MediaBrowser Token="{{ _app_config_jellyfin_api_key }}"
    # The LAN address for Seerr: the plugin calls it from Jellyfin, and its links open in your browser.
    _settings: >-
      {{ app_config_jellyfin_enhanced_settings | combine({
           'JellyseerrEnabled': true,
           'JellyseerrUrls': 'http://' ~ homelab_lan_ip ~ ':' ~ homelab_ports.seerr,
           'JellyseerrApiKey': _app_config_seerr_key,
           'DEFAULT_REGION': app_config_seerr_discover.streamingRegion | default('US'),
         }) | combine({'TMDB_API_KEY': app_config_tmdb_api_key} if app_config_tmdb_api_key else {}) }}
  when:
    - _app_config_jellyfin_api_key is defined
    - "'Jellyfin Enhanced' in _app_config_seerr_jf_plugins.json | map(attribute='Name')"
  block:
    - name: Seerr | Read Jellyfin Enhanced's settings
      ansible.builtin.uri:
        url: "{{ _url }}"
        headers:
          Authorization: "{{ _auth }}"
      register: _app_config_seerr_je
      check_mode: false
      no_log: true

    - name: Seerr | Save Jellyfin Enhanced's settings
      ansible.builtin.uri:
        url: "{{ _url }}"
        method: POST
        headers:
          Authorization: "{{ _auth }}"
        body_format: json
        body: "{{ _app_config_seerr_je.json | combine(_settings) }}"
        status_code: 204
      when: _app_config_seerr_je.json | combine(_settings) != _app_config_seerr_je.json
      changed_when: true
      no_log: true
