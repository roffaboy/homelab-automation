---
# One Pick rules set for one kind (movies or series) and one language profile, as Radarr and Sonarr
# have it: made when missing, then TRaSH's scores go in. Included once per pair by holyarrs.yml.
- name: HolyArrs rules | Work out the set
  ansible.builtin.set_fact:
    _app_config_hs_name: >-
      {{ _app_config_hs_pair.1.full | default(app_config_quality_profile
         ~ (' - ' ~ _app_config_hs_pair.1.name if _app_config_hs_pair.1.name else '')) }}
      ({{ app_config_holyarrs_trash[_app_config_hs_pair.0].label }})
    _app_config_hs_allowed: >-
      {{ app_config_holyarrs_ladder | select('in',
           (app_config_recyclarr_uhd_qualities if _app_config_hs_pair.1.full is defined else
            app_config_recyclarr_small_qualities + (_app_config_hs_pair.1.qualities | default([])))
           | map('extract', app_config_holyarrs_steps) | list) | list }}
    _app_config_hs_languages: >-
      {{ _app_config_hs_pair.1.languages | default([]) | map('extract', app_config_holyarrs_languages) | list }}

- name: HolyArrs rules | Make them
  ansible.builtin.uri:
    url: "{{ app_config_urls.holyarrs }}/api/v1/pick-rules"
    method: POST
    headers: "{{ _app_config_hs_headers }}"
    body_format: json
    body:
      name: "{{ _app_config_hs_name | trim }}"
      kinds:
        - "{{ _app_config_hs_pair.0 }}"
      body: "{{ lookup('ansible.builtin.template', 'holyarrs-pick-rules.yml.j2') | from_yaml }}"
    status_code: 201
  register: _app_config_hs_rule
  when: _app_config_hs_name | trim not in _app_config_hs['pick-rules'].pick_rules | map(attribute='name')
  changed_when: true

- name: HolyArrs rules | TRaSH's scores
  ansible.builtin.uri:
    url: "{{ app_config_urls.holyarrs }}/api/v1/pick-rules/{{ _app_config_hs_rule.json.id }}/trash"
    method: POST
    headers: "{{ _app_config_hs_headers }}"
    body_format: json
    body:
      app: "{{ app_config_holyarrs_trash[_app_config_hs_pair.0].app }}"
      profile_id: "{{ app_config_trash_uhd_profile if _app_config_hs_pair.1.full is defined else app_config_holyarrs_trash[_app_config_hs_pair.0].profile }}"
  when: _app_config_hs_rule.json is defined
  changed_when: true
