---
# Ansible sets up the server: the admin (shared login), libraries, name and transcoding,
# plus an API key for Radarr/Sonarr. Users and profiles you add yourself are left alone.

- name: Jellyfin | Read the setup state
  ansible.builtin.uri:
    url: "{{ app_config_urls.jellyfin }}/System/Info/Public"
  register: _app_config_jf_info
  check_mode: false

- name: Jellyfin | Complete the setup wizard (fresh install)
  ansible.builtin.import_tasks: jellyfin_wizard.yml
  when: not _app_config_jf_info.json.StartupWizardCompleted

- name: Jellyfin | Sign in as the admin
  ansible.builtin.uri:
    url: "{{ app_config_urls.jellyfin }}/Users/AuthenticateByName"
    method: POST
    headers:
      Authorization: "{{ app_config_jellyfin_client }}"
    body_format: json
    body:
      Username: "{{ homelab_username }}"
      Pw: "{{ homelab_password }}"
  register: _app_config_jf_login
  check_mode: false
  no_log: true

# Everything below talks to Jellyfin as the admin: the Authorization header and JSON bodies are the
# defaults of every uri task in the block, so the tasks only name what differs.
- name: Jellyfin | Configure the server
  vars:
    _auth: '{{ app_config_jellyfin_client }}, Token="{{ _app_config_jf_login.json.AccessToken }}"'
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "{{ _auth }}"
      body_format: json
  block:
    - name: Jellyfin | The server
      ansible.builtin.import_tasks: jellyfin_server.yml

    - name: Jellyfin | The users
      ansible.builtin.import_tasks: jellyfin_users.yml

    - name: Jellyfin | The API key, branding and plugins
      ansible.builtin.import_tasks: jellyfin_extras.yml
