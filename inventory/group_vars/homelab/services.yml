---
# The apps as Homepage shows them: one tile each, under a group (a tab in Homepage), in this order.
# Links go to the server's LAN address and homelab_ports; status dots and widgets reach the app on
# the Docker network, at host and port. A widget is Homepage's own (type), signed in with the API
# key (auth: key) or your login (auth: login), plus its own settings (extra).
# The tiles are generated by roles/app_config/templates/homepage-services.yaml.j2.
homelab_service_groups: [Watch, Request, Read, Library, Sources, Cleanup, Monitoring]

homelab_services:
  jellyfin:
    title: Jellyfin
    group: Watch
    icon: jellyfin.png
    host: jellyfin
    port: 8096
    widget:
      type: jellyfin
      version: 2
      auth: key
      key: "{{ _app_config_jellyfin_api_key }}"
      extra: {enableBlocks: true, enableNowPlaying: true}
  seerr:
    title: Seerr
    group: Request
    icon: seerr.png
    host: seerr
    port: 5055
    widget:
      type: seerr
      auth: key
      key: "{{ _app_config_seerr_key }}"
  suggestarr:
    title: SuggestArr
    group: Request
    icon: suggest-arr.png
    host: suggestarr
    port: 5000
    enabled: "{{ homelab_suggestarr | bool }}"
  calibre:
    title: Calibre-Web
    group: Read
    icon: calibre-web.png
    host: calibre
    port: 8083
    enabled: "{{ homelab_books | bool }}"
    widget:
      type: calibreweb
      auth: login
  radarr:
    title: Radarr
    group: Library
    icon: radarr.png
    host: radarr
    port: 7878
    widget:
      type: radarr
      auth: key
      key: "{{ _app_config_api_keys.radarr }}"
      extra: {enableQueue: true}
  sonarr:
    title: Sonarr
    group: Library
    icon: sonarr.png
    host: sonarr
    port: 8989
    widget:
      type: sonarr
      auth: key
      key: "{{ _app_config_api_keys.sonarr }}"
      extra: {enableQueue: true}
  bazarr:
    title: Bazarr
    group: Library
    icon: bazarr.png
    host: bazarr
    port: 6767
    enabled: "{{ homelab_bazarr | bool }}"
    widget:
      type: bazarr
      auth: key
      key: "{{ _app_config_bazarr_key }}"
  prowlarr:
    title: Prowlarr
    group: Sources
    icon: prowlarr.png
    host: prowlarr
    port: 9696
    widget:
      type: prowlarr
      auth: key
      key: "{{ _app_config_api_keys.prowlarr }}"
  qbittorrent:
    title: qBittorrent
    group: Sources
    icon: qbittorrent.png
    host: gluetun   # qBittorrent runs in the VPN container's network
    port: "{{ homelab_ports.qbittorrent }}"
    widget:
      type: qbittorrent
      auth: login
  cleanuparr:
    title: Cleanuparr
    group: Cleanup
    icon: cleanuparr.png
    host: cleanuparr
    port: 11011
    monitor_path: /health
  maintainerr:
    title: Maintainerr
    group: Cleanup
    icon: maintainerr.png
    host: maintainerr
    port: 6246
    widget:
      type: maintainerr
      extra: {fields: [reclaimable, itemsHandled]}
  grafana:
    title: Grafana
    group: Monitoring
    icon: grafana.png
    host: grafana
    port: 3000
    enabled: "{{ homelab_monitoring | bool }}"
    widget:
      type: grafana
      version: 2
      auth: login
  prometheus:
    title: Prometheus
    group: Monitoring
    icon: prometheus.png
    host: prometheus
    port: 9090
    link: false   # no web UI worth opening
    enabled: "{{ homelab_monitoring | bool }}"
    widget:
      type: prometheus
