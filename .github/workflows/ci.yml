# Checks every PR before it gets merged: first ansible-lint and the unit tests of the modules (on both
# Ubuntu versions), then (only when both pass, and
# not for a PR that only changes Markdown) setup.sh and the playbook on a fresh Ubuntu VM, on 24.04 and 26.04. The
# playbook runs twice: the first run is a fresh install with every app wired up; the second
# must change nothing. Renovate's image updates are tested this way too.
# The real configuration isn't here, so lint uses config.example/ and the test dummy values.
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash   # with pipefail, so a failing playbook isn't hidden by tee

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A PR that only changes Markdown skips the test job; a skipped job counts as passed.
      - name: Check what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
            ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qv '\.md$'; then
            echo code=false >>"$GITHUB_OUTPUT"
          else
            echo code=true >>"$GITHUB_OUTPUT"
          fi
      - name: Use the example configuration
        run: |
          cp -r config.example config
          echo ci >.vault_pass
      - uses: ansible/ansible-lint@v26.11.0

  # The unit tests of the modules, on both Ubuntu versions, next to the lint: the two have another
  # Python and so another ansible-core (requirements.txt), and the modules run inside it. They have
  # to pass before an install is tried: a module that fails here would fail the playbook there.
  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ansible-core the way setup.sh does
        run: |
          python3 -m venv /tmp/tests-venv
          /tmp/tests-venv/bin/pip install -q -r requirements.txt
          /tmp/tests-venv/bin/ansible --version | head -1
      - name: Unit tests
        run: /tmp/tests-venv/bin/python -m unittest discover -s tests -v

  # The install runs on both Ubuntu LTS versions the playbook supports, next to each other. The
  # Docker install is the same as on a server; the VM has no VPN (no wg0.conf), GPU
  # (homelab_ci) or Tailscale. Not again after the merge: the PR already ran it.
  install:
    name: install (${{ matrix.os }})
    needs: [lint, unit]
    if: github.event_name == 'pull_request' && needs.lint.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PLAYBOOK: >-
        .venv/bin/ansible-playbook provision.yml -e homelab_ci=true
    steps:
      - uses: actions/checkout@v7

      # The way a new user starts (README): init-config.sh asks its questions (answered here from
      # a pipe), then setup.sh installs Ansible and encrypts the vault with a new password.
      # Every option on that the VM can run, so a release is tested whole; no Tailscale on the VM.
      - name: Test configuration
        run: |
          printf '%s\n' runner Test-password-123 test@example.com y y y y y test n |
            CONFIG_DIR="$PWD/config" ./init-config.sh
          cat >>config/vault.yml <<'VAULT'
          vault_simkl_client_id: test
          vault_omdb_api_key: test
          VAULT
          # Seerr's defaults go through rest_settings: the first run sets them, the second must not.
          cat >>config/settings.yml <<'SETTINGS'
          app_config_seerr_discover:
            originalLanguage: "nl|en"
            streamingRegion: NL
          SETTINGS
          cp config.example/maintainerr.yml config/   # the example rules are tested too

      - name: Setup
        run: ./setup.sh

      - name: Fresh install
        run: $PLAYBOOK

      - name: Second run changes nothing
        run: |
          $PLAYBOOK | tee second-run.log
          grep -Eq ' changed=0 ' second-run.log

      # The settings of every app after the install, to compare with a running server:
      #   gh run download <run> -n fresh-config-ubuntu-26.04, then tools/dump-config.py on the server
      - name: Dump the settings of the fresh install
        run: .venv/bin/python tools/dump-config.py > fresh-config.json
      - uses: actions/upload-artifact@v7
        with:
          name: fresh-config-${{ matrix.os }}
          path: fresh-config.json
          retention-days: 14

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          for name in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::$name"; docker logs --tail 50 "$name" 2>&1; echo "::endgroup::"
          done

  # One check for the branch protection to require, whatever the matrix looks like: it passes when
  # the installs passed or were skipped (a PR that only changes Markdown).
  test:
    needs: [lint, unit, install]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Lint and unit tests passed, installs passed or were skipped
        run: |
          echo "lint: ${{ needs.lint.result }}, unit: ${{ needs.unit.result }}, install: ${{ needs.install.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] &&
            { [ "${{ needs.install.result }}" = success ] || [ "${{ needs.install.result }}" = skipped ]; }
