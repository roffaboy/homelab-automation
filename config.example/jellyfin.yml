# By default Intro Skipper and Jellyfin Enhanced, plus Simkl with vault_simkl_client_id: log in
# at Dashboard, Plugins, Simkl, and leave its import into Jellyfin off, or Maintainerr removes
# what you watched elsewhere long ago. Plugins from another repository need it in
# app_config_jellyfin_repositories too.
# app_config_jellyfin_plugins: [Intro Skipper, Jellyfin Enhanced, Simkl]
